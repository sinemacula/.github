# ==============================================================================
# REUSABLE WORKFLOW: Node Quality Gates
# ==============================================================================
# Quality gates for Sine Macula Node / TypeScript repositories that are not run
# by the qlty app: dead-code detection (knip), an optional bundle-size budget
# (size-limit), and mutation testing. Mutation runs scoped to the changed files
# on pull requests and a full pass on a schedule, matching the org convention.
#
# Consumers call it with a one-line `uses:`. Budgets and the mutation threshold
# live in each repository's own config, so this workflow stays threshold-
# agnostic. The size job toggles off for backends, libraries and tooling with no
# bundle. The consumer provides `deadcode`, `size`, `mutation:scope` and
# `test:mutation` scripts for the jobs it runs.
#
# Consumers that enable Stryker's `incremental` option get a cached incremental
# report, keyed on the branch and on a fingerprint of the test environment so a
# rewritten test never reuses the verdict recorded against the old one. The
# cache is restored only from the branch's own runs; the scheduled sweep forces
# a full rerun.
# ==============================================================================
name: Node Quality Gates

# ==============================================================================
# TRIGGER
# ==============================================================================
on:
    workflow_call:
        inputs:
            heavy-runner:
                description: Runner label used for resource-intensive jobs
                type: string
                required: false
                default: ubuntu-latest
            node-version:
                description: Node.js version for the single-runner gates
                type: string
                required: false
                default: '24'
            run-size:
                description: Run the size-limit bundle-budget gate
                type: boolean
                required: false
                default: true
            run-mutation:
                description: Run the mutation gate
                type: boolean
                required: false
                default: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: DEAD CODE
    # ==========================================================================
    deadcode:
        name: Dead code (knip)
        if: ${{ github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Knip
                run: npm run deadcode

    # ==========================================================================
    # JOB: BUNDLE SIZE
    # ==========================================================================
    size:
        name: Bundle size (size-limit)
        if: ${{ inputs.run-size && github.event_name != 'schedule' }}
        runs-on: ${{ inputs.heavy-runner }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Build
                run: npm run build

            -   name: Check bundle size
                run: npm run size

    # ==========================================================================
    # JOB: MUTATION (scoped to the diff, on pull requests and pushes)
    # ==========================================================================
    mutation:
        name: Mutation (scoped)
        if: ${{ inputs.run-mutation && github.event_name != 'schedule' }}
        runs-on: ${{ inputs.heavy-runner }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # Full history so origin/master resolves for the scoped diff.
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Fingerprint the test environment
                env:
                    # Stryker only invalidates a mutant when the mutated code
                    # changes, never when the tests protecting it change, and for
                    # static mutants it cannot tell at all. A key on the commit
                    # alone would therefore reuse verdicts recorded against tests
                    # that have since been rewritten, so the tests and the
                    # tooling around them are fingerprinted as well.
                    HASH: >-
                        ${{ hashFiles('package-lock.json', '**/tsconfig*.json', '**/stryker*.config.*',
                        '**/vitest.config.*', '**/vitest.workspace.*', '**/*.test.*', '**/*.spec.*',
                        '**/__tests__/**', '**/__mocks__/**', '**/test-support/**',
                        '**/__snapshots__/**', '**/*.snap', '!**/node_modules/**') }}
                run: echo "TEST_ENV_HASH=$HASH" >> "$GITHUB_ENV"

            -   name: Restore mutation incremental cache
                uses: actions/cache@v6
                with:
                    # Where Stryker writes the incremental report. Not the temp
                    # dir - that is deleted after a successful run.
                    path: reports/stryker-incremental.json
                    key: stryker-${{ runner.os }}-${{ github.ref_name }}-${{ env.TEST_ENV_HASH }}-${{ github.sha }}
                    # Branch-local by design. Stryker keeps cached out-of-scope
                    # mutants in the report and scores them alongside the scoped
                    # ones, and the break threshold is applied to that blended
                    # figure, so restoring master's cache would let cached
                    # passing results mask survivors in the changed files.
                    # Revisit once the gate can score the mutated scope alone.
                    restore-keys: |
                        stryker-${{ runner.os }}-${{ github.ref_name }}-${{ env.TEST_ENV_HASH }}-

            -   name: Scoped mutation gate
                env:
                    BASE_REF: ${{ github.base_ref || 'master' }}
                run: |
                    files=$(npm run -s mutation:scope -- --base "origin/${BASE_REF}")
                    if [ -z "$files" ]; then
                        echo "No mutable source files changed."
                        exit 0
                    fi
                    npm run test:mutation -- --mutate "$(echo "$files" | paste -sd, -)"

    # ==========================================================================
    # JOB: MUTATION FULL (scheduled / manual)
    # ==========================================================================
    # Blocking, not advisory: this sweep is the safety net for the per-PR
    # scoping, so anything it finds outside the changed files has to be visible
    # and actionable rather than a silently red-but-passing job.
    # ==========================================================================
    mutation-full:
        name: Mutation (full)
        if: ${{ inputs.run-mutation && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        runs-on: ${{ inputs.heavy-runner }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Fingerprint the test environment
                env:
                    # As in the scoped job: a rewritten test must not reuse the
                    # verdict recorded against the old one.
                    HASH: >-
                        ${{ hashFiles('package-lock.json', '**/tsconfig*.json', '**/stryker*.config.*',
                        '**/vitest.config.*', '**/vitest.workspace.*', '**/*.test.*', '**/*.spec.*',
                        '**/__tests__/**', '**/__mocks__/**', '**/test-support/**',
                        '**/__snapshots__/**', '**/*.snap', '!**/node_modules/**') }}
                run: echo "TEST_ENV_HASH=$HASH" >> "$GITHUB_ENV"

            -   name: Restore mutation incremental cache
                uses: actions/cache@v6
                with:
                    # Where Stryker writes the incremental report. Not the temp
                    # dir - that is deleted after a successful run.
                    path: reports/stryker-incremental.json
                    key: stryker-${{ runner.os }}-${{ github.ref_name }}-${{ env.TEST_ENV_HASH }}-${{ github.sha }}
                    # This sweep mutates everything and reruns every mutant, so
                    # there is no out-of-scope report to blend and master's
                    # cache is a safe warm start for a manual run off-branch.
                    restore-keys: |
                        stryker-${{ runner.os }}-${{ github.ref_name }}-${{ env.TEST_ENV_HASH }}-
                        stryker-${{ runner.os }}-master-${{ env.TEST_ENV_HASH }}-

            -   name: Full mutation suite
                # `incremental` is read on every run, so without `--force` the
                # sweep would reuse the cache and stop being a full rerun. The
                # flag reruns every mutant and rewrites the report, which keeps
                # this working without a second npm script in every consumer.
                run: npm run test:mutation -- --force

            -   name: Upload mutation report
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-report
                    path: build/mutation/
                    retention-days: 30
