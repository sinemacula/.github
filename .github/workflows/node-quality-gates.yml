# ==============================================================================
# REUSABLE WORKFLOW: Node Quality Gates
# ==============================================================================
# Quality gates for Sine Macula Node / TypeScript repositories that are not run
# by the qlty app: dead-code detection (knip), an optional bundle-size budget
# (size-limit), and mutation testing. Mutation runs scoped to the changed files
# on pull requests and a full pass on a schedule, matching the org convention.
#
# Consumers call it with a one-line `uses:`. Budgets and the mutation threshold
# live in each repository's own config, so this workflow stays threshold-
# agnostic. The size job toggles off for backends, libraries and tooling with no
# bundle. The consumer provides `deadcode`, `size`, `mutation:scope` and
# `test:mutation` scripts for the jobs it runs.
#
# The scoped gate splits the changed files across up to `mutation-shards`
# runners, and each shard must meet the break threshold both in Stryker's
# figure and on its own scope. With Stryker's `incremental` option each
# shard's report is cached, and the reports are merged and restored only from
# the branch's own runs. Cached survivors and static non-kills always rerun,
# and so does a kill whose test file changed at all: Stryker only sees an edit
# that falls inside a test's own lines. Cached timeouts are left to Stryker's
# own reuse rules: it scores them as detected, and retesting one costs a full
# timeout. The key covers the tooling and the test helpers, fixtures, data
# files and snapshots. The scheduled sweep forces a full rerun.
#
# A full sweep too long for one job splits across `mutation-full-shards`
# runners by whole files, heaviest first by the last sweep's timings. Each
# shard defers the break threshold, and the `Mutation (full)` job merges the
# reports, fails on any missing, stale or unfinished one, and applies the
# threshold once to the merged score. With one shard the sweep runs as one
# job, as it always has. Report freshness, merging and scoring live in
# `.github/scripts`, which the jobs check out at this workflow's own commit.
# ==============================================================================
name: Node Quality Gates

# ==============================================================================
# TRIGGER
# ==============================================================================
on:
    workflow_call:
        inputs:
            heavy-runner:
                description: Runner label used for resource-intensive jobs
                type: string
                required: false
                default: ubuntu-latest
            node-version:
                description: Node.js version for the single-runner gates
                type: string
                required: false
                default: '24'
            run-size:
                description: Run the size-limit bundle-budget gate
                type: boolean
                required: false
                default: true
            run-mutation:
                description: Run the mutation gate
                type: boolean
                required: false
                default: true
            mutation-shards:
                description: >-
                    Maximum heavy runners the scoped mutation gate splits the changed files across (1 to 256).
                    The required check stays "Mutation (scoped)".
                type: number
                required: false
                default: 1
            mutation-full-shards:
                description: >-
                    Heavy runners the scheduled or manual full sweep splits across (1 to 64). At 1 it runs
                    unsplit, as before. The verdict stays "Mutation (full)".
                type: number
                required: false
                default: 1

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# ENVIRONMENT
# ==============================================================================
# A stalled cache download otherwise holds a job for ten minutes before it
# falls back to a normal install; one minute makes it fall back quickly.
# ==============================================================================
env:
    SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: DEAD CODE
    # ==========================================================================
    deadcode:
        name: Dead code (knip)
        if: ${{ github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Knip
                run: npm run deadcode

    # ==========================================================================
    # JOB: BUNDLE SIZE
    # ==========================================================================
    size:
        name: Bundle size (size-limit)
        if: ${{ inputs.run-size && github.event_name != 'schedule' }}
        runs-on: ${{ inputs.heavy-runner }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Build
                run: npm run build

            -   name: Check bundle size
                run: npm run size

    # ==========================================================================
    # JOB: MUTATION PLAN (scope and shards, on pull requests and pushes)
    # ==========================================================================
    mutation-plan:
        name: Mutation plan
        if: ${{ inputs.run-mutation && github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        outputs:
            empty: ${{ steps.plan.outputs.empty }}
            fingerprint: ${{ steps.plan.outputs.fingerprint }}
            matrix: ${{ steps.plan.outputs.matrix }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # Full history so origin/master resolves for the scoped diff.
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Plan the shards
                id: plan
                env:
                    BASE_REF: ${{ github.base_ref || 'master' }}
                    SHARDS: ${{ inputs.mutation-shards }}
                    SCOPE_FILE: ${{ runner.temp }}/scope.txt
                run: |
                    npm run -s mutation:scope -- --base "origin/${BASE_REF}" > "$SCOPE_FILE"
                    node - <<'JS'
                    // Splits the scope into balanced shards and fingerprints what the tests read.
                    const fs = require('node:fs');
                    const crypto = require('node:crypto');
                    const path = require('node:path');
                    const { execFileSync } = require('node:child_process');

                    const fail = (message) => {
                        console.log(`::error::${message}`);
                        process.exit(1);
                    };
                    const output = (name, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
                    const sha256 = (data) => crypto.createHash('sha256').update(data).digest('hex');

                    // Test files stay out of the key: the shard retests the kills of a test file that changed.
                    const tooling = [/^package-lock\.json$/, /^tsconfig.*\.json$/, /^stryker.*\.config\./,
                        /^vitest.*\.(config|workspace)\./];
                    // Data files named like tests (foo.test.json) count as support wherever they sit.
                    const support = new RegExp(String.raw`(^|/)(tests?|specs?|__(tests|mocks|fixtures|snapshots)__`
                        + String.raw`|test-support)/|\.snap$|\.(test|spec)\.[^/]+$`);
                    // Keep in step with the test file record, which hashes exactly these files instead.
                    const testFile = /(\.(test|spec)|[sS]pec)\.[cm]?[jt]sx?$/;
                    const fingerprinted = (file) => tooling.some((pattern) => pattern.test(file.split('/').pop()))
                        || (support.test(file) && !testFile.test(file));
                    const fingerprint = sha256(execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
                        .split('\0')
                        .filter((file) => file && fingerprinted(file))
                        .sort()
                        .map((file) => {
                            let digest = 'unreadable';
                            try {
                                digest = sha256(fs.readFileSync(file));
                            } catch {}
                            return `${file}\0${digest}\n`;
                        })
                        .join(''));
                    output('fingerprint', fingerprint);

                    const shards = Number(process.env.SHARDS);
                    if (!Number.isInteger(shards) || shards < 1 || shards > 256) {
                        fail(`mutation-shards must be an integer from 1 to 256, got '${process.env.SHARDS}'.`);
                    }

                    const lineCount = (file) => {
                        try {
                            return fs.readFileSync(file, 'utf8').split('\n').length;
                        } catch {
                            return 1;
                        }
                    };
                    const normalise = (file) =>
                        path.relative(process.cwd(), path.resolve(file)).split(path.sep).join('/');
                    let tracked;
                    // Extended globs count too: @(a|b), +(a), !(a), ?(a), *(a) and a|b inside parentheses.
                    const isGlob = (pattern) => /[*?[\]{}]|[@+!]\(|\([^)]*\|/.test(pattern) && !fs.existsSync(pattern);
                    const matches = (file, pattern) => {
                        if (!isGlob(pattern)) {
                            return file === normalise(pattern);
                        }
                        if (typeof path.matchesGlob !== 'function') {
                            fail(`Scope entry '${pattern}' is a glob, which needs Node.js 22.5 or later.`);
                        }
                        return path.matchesGlob(file, normalise(pattern));
                    };

                    // Globs become the tracked files they match, in order, so shards and scores see real paths.
                    const scoped = new Map();
                    for (const line of fs.readFileSync(process.env.SCOPE_FILE, 'utf8').split('\n')) {
                        const text = line.replace(/\r$/, '').trim();
                        if (text === '') {
                            continue;
                        }
                        if (text.includes(',')) {
                            fail(`Scope entry '${text}' contains a comma, which --mutate cannot carry.`);
                        }
                        const negated = text.startsWith('!');
                        const body = negated ? text.slice(1) : text;
                        // Stryker's own range syntax: path:line[:column]-line[:column].
                        const range = /^(.*?):((\d+)(?::(\d+))?-(\d+)(?::(\d+))?)$/.exec(body);
                        const pattern = range ? range[1] : body;
                        if (negated) {
                            // As in Stryker, an exclusion drops the whole file whatever its range.
                            for (const [key, entry] of scoped) {
                                if (matches(entry.path, pattern)) {
                                    scoped.delete(key);
                                }
                            }
                            continue;
                        }
                        const [start, end] = range ? [Number(range[3]), Number(range[5])] : [0, 0];
                        if (range && (start < 1 || start > end)) {
                            fail(`Scope entry '${text}' has an empty or reversed line range.`);
                        }
                        tracked ??= execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0');
                        const files = isGlob(pattern)
                            ? tracked.filter((file) => file && matches(file, pattern))
                            : [normalise(pattern)];
                        if (files.length === 0) {
                            console.log(`::warning::Scope entry '${text}' matches no tracked file.`);
                        }
                        for (const file of files) {
                            if (file.includes(',')) {
                                fail(`Scope entry '${text}' matches '${file}', whose comma --mutate cannot carry.`);
                            }
                            const weight = range ? end - start + 1 : lineCount(file);
                            const entry = range ? `${file}:${range[2]}` : file;
                            scoped.set(entry, { path: file, start, text: entry, weight, range: Boolean(range) });
                        }
                    }
                    const byPath = new Map();
                    for (const entry of scoped.values()) {
                        byPath.set(entry.path, [...(byPath.get(entry.path) ?? []), entry]);
                    }

                    if (byPath.size === 0) {
                        console.log('No mutable source files changed.');
                        output('empty', 'true');
                        output('matrix', JSON.stringify({ include: [] }));
                        process.exit(0);
                    }

                    const compare = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
                    const weigh = (entries) => entries.reduce((sum, entry) => sum + entry.weight, 0);
                    const files = [...byPath.keys()].sort(compare).map((file) => byPath.get(file));
                    const total = files.reduce((sum, entries) => sum + weigh(entries), 0);

                    // A dominating file with several ranges is split by range; a range is never cut.
                    const units = files.flatMap((entries) =>
                        weigh(entries) > total / shards && entries.length > 1 && entries.every((entry) => entry.range)
                            ? entries.map((entry) => ({ key: entry.text, weight: entry.weight, entries: [entry] }))
                            : [{ key: entries[0].path, weight: weigh(entries), entries }]);
                    units.sort((a, b) => b.weight - a.weight || compare(a.key, b.key));

                    const count = Math.min(shards, units.length);
                    const bins = Array.from({ length: count }, () => ({ weight: 0, entries: [] }));
                    for (const unit of units) {
                        const bin = bins.reduce((least, other) => (other.weight < least.weight ? other : least));
                        bin.weight += unit.weight;
                        bin.entries.push(...unit.entries);
                    }

                    // Every entry is a real path now, but Stryker matches --mutate entries with minimatch after
                    // turning backslashes into slashes, so each magic character becomes a one-character class.
                    // A leading ! would read as an exclusion, so such a path starts with ./ instead.
                    const escape = (file) => file.replace(/^!/, './!').replace(/[?*()[\]{}]/g, '[$&]');
                    const include = bins.map((bin, index) => {
                        bin.entries.sort((a, b) => compare(a.path, b.path) || a.start - b.start);
                        const mutate = bin.entries
                            .map((entry) => escape(entry.path) + entry.text.slice(entry.path.length))
                            .join(',');
                        return { shard: index + 1, mutate };
                    });
                    output('empty', 'false');
                    output('matrix', JSON.stringify({ include }));

                    const rows = bins.map((bin, index) => {
                        const entries = bin.entries.map((entry) => `\`${entry.text}\``).join(' ');
                        return `| ${index + 1} | ${bin.weight} | ${entries} |`;
                    });
                    const summary = ['| Shard | Weight | Entries |', '| --- | --- | --- |', ...rows].join('\n');
                    fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Mutation shards\n\n${summary}\n`);
                    console.log(summary);
                    JS

    # ==========================================================================
    # JOB: MUTATION SHARD (one runner per planned shard)
    # ==========================================================================
    # Each shard restores the newest cache entry for the branch, drops what a
    # cached result cannot vouch for, and saves its own report whether it
    # passed or failed. Stryker's break threshold still applies, and the
    # shard's own scope must meet it too: Stryker's figure also counts the
    # cached kills it carries from outside the scope.
    # ==========================================================================
    mutation-shard:
        name: Mutation shard ${{ matrix.shard }}
        needs: mutation-plan
        if: ${{ needs.mutation-plan.outputs.empty == 'false' }}
        runs-on: ${{ inputs.heavy-runner }}

        strategy:
            # A shard cancelled by a sibling's failure would save nothing.
            fail-fast: false
            matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}

        env:
            MUTATE: ${{ matrix.mutate }}
            REPORT: reports/stryker-incremental.json
            TESTS: reports/stryker-incremental.tests.json
            EMPTY: reports/stryker-incremental.empty.json

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # Full history: the scoped diff and some tests run git.
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Checkout the report scripts
                uses: actions/checkout@v7
                with:
                    repository: ${{ job.workflow_repository }}
                    ref: ${{ job.workflow_sha }}
                    path: .mutation-scripts
                    sparse-checkout: .github/scripts
                    persist-credentials: false

            # Out of the workspace, so neither Stryker's sandbox nor the tests see them.
            -   name: Move the report scripts aside
                run: |
                    mv .mutation-scripts/.github/scripts "$RUNNER_TEMP/mutation-scripts"
                    rm -rf .mutation-scripts
                    echo "MUTATION_REPORTS=$RUNNER_TEMP/mutation-scripts/mutation-reports.mjs" >> "$GITHUB_ENV"

            -   name: Name the cache
                id: cache
                env:
                    REF: ${{ github.ref_name }}
                    FINGERPRINT: ${{ needs.mutation-plan.outputs.fingerprint }}
                run: echo "prefix=stryker-v3-${RUNNER_OS}-${REF}-${FINGERPRINT}" >> "$GITHUB_OUTPUT"

            -   name: Restore mutation incremental cache
                id: restore
                uses: actions/cache/restore@v6
                with:
                    # Where Stryker writes the incremental report, and the test
                    # files it was recorded against. Not the temp dir - that is
                    # deleted after a successful run.
                    path: |
                        reports/stryker-incremental.json
                        reports/stryker-incremental.tests.json
                    key: >-
                        ${{ steps.cache.outputs.prefix }}-shard-${{ matrix.shard }}-${{ github.run_id
                        }}-${{ github.run_attempt }}
                    # Branch-local by design: master's results were recorded
                    # against other code. The newest entry wins: the merged one
                    # after a finished run, else the last shard to save. Every
                    # report carries what its shard restored.
                    restore-keys: |
                        ${{ steps.cache.outputs.prefix }}-

            -   name: Drop cached results to retest
                run: |
                    node - <<'JS'
                    // Keeps a kill only when a test file that has not changed killed it; Stryker would reuse a
                    // kill after an edit outside the test's own lines, such as shared setup. Survivors, no-coverage
                    // results and static non-kills always rerun. Timeouts stay, static or not, for Stryker's own
                    // rules to reuse or retest: it scores a timeout as detected, and each retest costs a full
                    // timeout.
                    const fs = require('node:fs');
                    const path = require('node:path');
                    const crypto = require('node:crypto');
                    const normalise = (file) =>
                        path.relative(process.cwd(), path.resolve(file)).split(path.sep).join('/');
                    const digest = (file) => {
                        try {
                            return crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
                        } catch {
                            return 'missing';
                        }
                    };

                    let recorded = null;
                    try {
                        recorded = JSON.parse(fs.readFileSync(process.env.TESTS, 'utf8')).files ?? null;
                    } catch {}
                    // Only this run's record may be saved with this run's report.
                    fs.rmSync(process.env.TESTS, { force: true });

                    const file = process.env.REPORT;
                    if (!fs.existsSync(file)) {
                        console.log('No cached mutation results.');
                        process.exit(0);
                    }
                    let report;
                    try {
                        report = JSON.parse(fs.readFileSync(file, 'utf8'));
                    } catch {}
                    if (!report || typeof report.files !== 'object' || report.files === null) {
                        console.log('::warning::The cached mutation report is unreadable; running without it.');
                        fs.rmSync(file);
                        process.exit(0);
                    }
                    if (recorded === null) {
                        console.log('::warning::The cached report has no test file record; every cached kill reruns.');
                    }

                    const changed = new Set(Object.entries(recorded ?? {})
                        .filter(([name, hash]) => digest(name) !== hash)
                        .map(([name]) => name));
                    const testFileById = new Map();
                    for (const [name, testFile] of Object.entries(report.testFiles ?? {})) {
                        for (const test of name === '' ? [] : testFile.tests ?? []) {
                            testFileById.set(test.id, normalise(name));
                        }
                    }
                    const vouched = (mutant) => recorded !== null && (changed.size === 0
                        || (mutant.killedBy ?? []).some((id) => testFileById.has(id)
                            && !changed.has(testFileById.get(id))));
                    const keep = (mutant) => {
                        if (mutant.status === 'Killed') {
                            return vouched(mutant);
                        }
                        return mutant.status === 'Timeout'
                            || (['CompileError', 'Ignored'].includes(mutant.status) && mutant.static !== true);
                    };

                    let dropped = 0;
                    for (const result of Object.values(report.files)) {
                        const kept = (result.mutants ?? []).filter(keep);
                        dropped += (result.mutants ?? []).length - kept.length;
                        result.mutants = kept;
                    }
                    fs.writeFileSync(file, JSON.stringify(report));
                    [...changed].sort().forEach((name) => console.log(`Test file changed: ${name}`));
                    console.log(`Dropped ${dropped} cached result(s) for retesting.`);
                    JS

            -   name: Scoped mutation gate
                id: stryker
                env:
                    SHARD: ${{ matrix.shard }}
                # A scope with no mutants (a types-only file, say) finds no
                # related tests, and Stryker fails that as a config error.
                run: |
                    set -o pipefail
                    rm -f "$EMPTY"
                    touch "$RUNNER_TEMP/stryker-started"
                    log="$RUNNER_TEMP/stryker.log"
                    status=0
                    npm run test:mutation -- --mutate "$MUTATE" --incrementalFile "$REPORT" 2>&1 | tee "$log" \
                        || status=$?
                    [ "$status" -eq 0 ] && exit 0
                    plain=$(sed "s/$(printf '\033')\[[0-9;]*m//g" "$log")
                    if grep -Eq 'Instrumented [1-9][0-9]* source file\(s\) with 0 mutant\(s\)' <<< "$plain" \
                        && ! grep -Eq 'Instrumented [0-9]+ source file\(s\) with [1-9][0-9]* mutant\(s\)' <<< "$plain" \
                        && grep -Fq 'No tests were executed. Stryker will exit prematurely' <<< "$plain"; then
                        echo "::notice::Shard $SHARD has no mutants in scope."
                        # Tells the merge this shard has nothing to report, rather than a lost report.
                        mkdir -p reports
                        echo '{}' > "$EMPTY"
                        exit 0
                    fi
                    exit "$status"

            -   name: Check the report is fresh
                id: fresh
                if: ${{ !cancelled() }}
                # A restored or truncated report must never be saved, merged or
                # scored as this run's.
                run: |
                    if node "$MUTATION_REPORTS" fresh "$REPORT" "$RUNNER_TEMP/stryker-started"; then
                        echo "fresh=true" >> "$GITHUB_OUTPUT"
                    else
                        rm -f "$REPORT" "$TESTS"
                        echo "fresh=false" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Record the test files
                id: tests
                if: ${{ !cancelled() && steps.fresh.outputs.fresh == 'true' }}
                run: |
                    node - <<'JS'
                    // Hashes every test file the report names or the naming convention finds, for the next drop.
                    const fs = require('node:fs');
                    const path = require('node:path');
                    const crypto = require('node:crypto');
                    const { execFileSync } = require('node:child_process');
                    const normalise = (file) =>
                        path.relative(process.cwd(), path.resolve(file)).split(path.sep).join('/');
                    const digest = (file) => {
                        try {
                            return crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
                        } catch {
                            return 'missing';
                        }
                    };
                    const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
                    const named = Object.keys(report.testFiles ?? {}).filter((name) => name !== '').map(normalise);
                    const conventional = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
                        .split('\0')
                        // The plan's test file pattern: these files stay out of its fingerprint.
                        .filter((name) => /(\.(test|spec)|[sS]pec)\.[cm]?[jt]sx?$/.test(name));
                    const files = Object.fromEntries([...new Set([...named, ...conventional])]
                        .sort()
                        .map((name) => [name, digest(name)]));
                    fs.writeFileSync(process.env.TESTS, JSON.stringify({ files }));
                    console.log(`Recorded ${Object.keys(files).length} test file(s).`);
                    JS

            -   name: Save mutation incremental cache
                if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
                uses: actions/cache/save@v6
                with:
                    path: |
                        reports/stryker-incremental.json
                        reports/stryker-incremental.tests.json
                    key: ${{ steps.restore.outputs.cache-primary-key }}

            -   name: Score the shard's own scope
                if: ${{ !cancelled() && steps.stryker.outcome != 'skipped' && steps.fresh.outcome == 'success' }}
                env:
                    FRESH: ${{ steps.fresh.outputs.fresh }}
                run: |
                    if [ "$FRESH" != true ]; then
                        echo "::notice::No incremental report, so the gate's own verdict stands."
                        exit 0
                    fi
                    node --input-type=module - <<'JS'
                    // Counts only mutants inside this shard's --mutate entries, by Stryker's range rules.
                    import fs from 'node:fs';
                    const { breaks, inScope, normalise, parseScope, scoreReport, undetectedLines } =
                        await import(process.env.MUTATION_REPORTS);
                    const scope = parseScope(process.env.MUTATE);
                    const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
                    const files = {};
                    for (const file of scope.keys()) {
                        const mutants = Object.entries(report.files)
                            .filter(([name]) => normalise(name) === file)
                            .flatMap(([, result]) => result.mutants ?? [])
                            .filter((mutant) => inScope(scope, file, mutant));
                        if (mutants.length === 0) {
                            console.log(`::warning::No mutants in scope for ${file}.`);
                        } else {
                            files[file] = { ...report.files[file], mutants };
                        }
                    }
                    const scoped = { ...report, files };

                    const { score, detected, timedOut, undetected, counted } = await scoreReport(scoped);
                    const lines = undetectedLines(scoped);
                    const threshold = report.thresholds?.break;
                    // A timeout counts as detected, as in Stryker; the count shows how much rests on that.
                    const verdict = counted === 0
                        ? 'In-scope mutation score: no counted mutants.'
                        : `In-scope mutation score: ${score.toFixed(2)} (${detected} detected, ${timedOut} of them`
                            + ` by timeout, ${undetected} undetected).`;
                    lines.forEach((line) => console.log(line));
                    console.log(verdict);
                    fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Mutation shard\n\n${verdict}\n`
                        + (lines.length ? `\n~~~text\n${lines.join('\n')}\n~~~\n` : ''));
                    if (counted > 0 && breaks(score, threshold)) {
                        console.log(`::error::Score ${score.toFixed(2)} is under break threshold ${threshold}.`);
                        process.exit(1);
                    }
                    JS

            -   name: Upload shard report
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-scoped-shard-${{ matrix.shard }}
                    path: |
                        reports/stryker-incremental.json
                        reports/stryker-incremental.tests.json
                        reports/stryker-incremental.empty.json
                        build/mutation/
                    if-no-files-found: ignore
                    overwrite: true
                    retention-days: 7

    # ==========================================================================
    # JOB: MUTATION CACHE (merge the shard reports)
    # ==========================================================================
    # GitHub restores a single cache entry, so the shards' reports are merged
    # into one that every shard restores next time. It also runs when the run
    # is cancelled, so the shards that finished are kept; after a run whose
    # shards all passed, a missing report stops the merge instead. Best effort:
    # a failed merge only costs reuse. Runs on the shards' runner so it writes
    # to the cache they read.
    # ==========================================================================
    mutation-cache:
        name: Mutation cache
        needs: [ mutation-plan, mutation-shard ]
        if: ${{ always() && needs.mutation-plan.outputs.empty == 'false' }}
        runs-on: ${{ inputs.heavy-runner }}

        steps:
            -   name: Setup Node.js
                if: ${{ always() }}
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}

            -   name: Checkout the report scripts
                if: ${{ always() }}
                uses: actions/checkout@v7
                with:
                    repository: ${{ job.workflow_repository }}
                    ref: ${{ job.workflow_sha }}
                    path: .mutation-scripts
                    sparse-checkout: .github/scripts
                    persist-credentials: false

            -   name: Name the cache
                id: cache
                if: ${{ always() }}
                env:
                    REF: ${{ github.ref_name }}
                    FINGERPRINT: ${{ needs.mutation-plan.outputs.fingerprint }}
                run: echo "prefix=stryker-v3-${RUNNER_OS}-${REF}-${FINGERPRINT}" >> "$GITHUB_OUTPUT"

            -   name: Download shard reports
                if: ${{ always() }}
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    pattern: mutation-scoped-shard-*
                    path: ${{ runner.temp }}/shards

            -   name: Merge shard reports
                id: merge
                if: ${{ always() }}
                continue-on-error: true
                env:
                    MATRIX: ${{ needs.mutation-plan.outputs.matrix }}
                    SHARDS: ${{ needs.mutation-shard.result }}
                    SHARDS_DIR: ${{ runner.temp }}/shards
                run: |
                    node --input-type=module - <<'JS'
                    import fs from 'node:fs';
                    const { collectShards, mergeReports, parseScope } =
                        await import(`${process.cwd()}/.mutation-scripts/.github/scripts/mutation-reports.mjs`);
                    const plan = JSON.parse(process.env.MATRIX).include;
                    const scopes = new Map(plan.map(({ shard, mutate }) => [shard, parseScope(mutate)]));
                    const { found, missing } = collectShards(process.env.SHARDS_DIR, 'mutation-scoped-shard-',
                        plan.map(({ shard }) => shard));

                    const entries = [];
                    const unreported = [...missing];
                    for (const { shard, read } of found) {
                        const report = read('stryker-incremental.json');
                        const tests = read('stryker-incremental.tests.json');
                        if (report && tests) {
                            entries.push({ shard, report, tests });
                        } else if (!read('stryker-incremental.empty.json')) {
                            unreported.push(shard);
                        }
                    }
                    if (entries.length === 0) {
                        console.log('No shard reports to merge.');
                        process.exit(0);
                    }
                    if (unreported.length > 0) {
                        if (process.env.SHARDS === 'success') {
                            console.log(`::error::Shard(s) ${unreported.join(', ')} passed without a report;`
                                + ' the cache keeps each shard\'s own entry.');
                            process.exit(1);
                        }
                        console.log(`Shard(s) ${unreported.join(', ')} did not finish; merging the rest.`);
                    }

                    const { report, files, mutants, stale } = mergeReports(entries, scopes);
                    fs.mkdirSync('reports', { recursive: true });
                    fs.writeFileSync('reports/stryker-incremental.json', JSON.stringify(report));
                    // Every shard ran the same commit, so any shard's test file record fits.
                    fs.writeFileSync('reports/stryker-incremental.tests.json', JSON.stringify(entries[0].tests));
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, 'merged=true\n');
                    console.log(`Merged ${entries.length} report(s), ${files} file(s), ${mutants} mutant(s);`
                        + ` dropped ${stale} carried result(s) their owner no longer reports.`);
                    JS

            -   name: Save merged mutation cache
                if: ${{ always() && steps.merge.outputs.merged == 'true' }}
                continue-on-error: true
                uses: actions/cache/save@v6
                with:
                    path: |
                        reports/stryker-incremental.json
                        reports/stryker-incremental.tests.json
                    key: ${{ steps.cache.outputs.prefix }}-all-${{ github.run_id }}-${{ github.run_attempt }}

    # ==========================================================================
    # JOB: MUTATION (scoped verdict)
    # ==========================================================================
    # The required check. It passes only when every shard passed or the scope
    # was empty, and reports a failure when the run was cancelled.
    # ==========================================================================
    mutation:
        name: Mutation (scoped)
        needs: [ mutation-plan, mutation-shard ]
        if: ${{ always() && inputs.run-mutation && github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Check the shards
                env:
                    PLAN: ${{ needs.mutation-plan.result }}
                    EMPTY: ${{ needs.mutation-plan.outputs.empty }}
                    SHARDS: ${{ needs.mutation-shard.result }}
                run: |
                    [ "$PLAN" = success ] || { echo "::error::Mutation plan: $PLAN"; exit 1; }
                    if [ "$EMPTY" = true ] && [ "$SHARDS" = skipped ]; then
                        echo "No mutable source files changed."
                        exit 0
                    fi
                    [ "$SHARDS" = success ] || { echo "::error::Mutation shards: $SHARDS"; exit 1; }

    # ==========================================================================
    # JOB: MUTATION FULL PLAN (scheduled / manual)
    # ==========================================================================
    # Splits Stryker's `mutate` scope into whole files, so no mutant can fall
    # between two shards, and balances them by the last sweep's measured time
    # per file, or by line count for a file it has not timed.
    # ==========================================================================
    mutation-full-plan:
        name: Mutation (full) plan
        if: ${{ inputs.run-mutation && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest

        outputs:
            matrix: ${{ steps.count.outputs.matrix || steps.plan.outputs.matrix }}
            sharded: ${{ steps.count.outputs.sharded }}

        steps:
            -   name: Check the shard count
                id: count
                env:
                    SHARDS: ${{ inputs.mutation-full-shards }}
                run: |
                    if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 64 ]; then
                        echo "::error::mutation-full-shards must be an integer from 1 to 64, got '$SHARDS'."
                        exit 1
                    fi
                    if [ "$SHARDS" -eq 1 ]; then
                        echo 'matrix={"include":[{"shard":1,"mutate":""}]}' >> "$GITHUB_OUTPUT"
                        echo "sharded=false" >> "$GITHUB_OUTPUT"
                    else
                        echo "sharded=true" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Checkout
                if: ${{ steps.count.outputs.sharded == 'true' }}
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Checkout the report scripts
                if: ${{ steps.count.outputs.sharded == 'true' }}
                uses: actions/checkout@v7
                with:
                    repository: ${{ job.workflow_repository }}
                    ref: ${{ job.workflow_sha }}
                    path: .mutation-scripts
                    sparse-checkout: .github/scripts
                    persist-credentials: false

            -   name: Move the report scripts aside
                if: ${{ steps.count.outputs.sharded == 'true' }}
                run: |
                    mv .mutation-scripts/.github/scripts "$RUNNER_TEMP/mutation-scripts"
                    rm -rf .mutation-scripts
                    echo "MUTATION_REPORTS=$RUNNER_TEMP/mutation-scripts/mutation-reports.mjs" >> "$GITHUB_ENV"

            -   name: Setup Node.js
                if: ${{ steps.count.outputs.sharded == 'true' }}
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Restore the sweep timings
                if: ${{ steps.count.outputs.sharded == 'true' }}
                uses: actions/cache/restore@v6
                with:
                    path: ${{ runner.temp }}/mutation-full-history.json
                    key: stryker-full-history-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
                    restore-keys: |
                        stryker-full-history-v1-${{ runner.os }}-

            -   name: Plan the shards
                id: plan
                if: ${{ steps.count.outputs.sharded == 'true' }}
                env:
                    SHARDS: ${{ inputs.mutation-full-shards }}
                    HISTORY: ${{ runner.temp }}/mutation-full-history.json
                run: |
                    # Only a scope script needs the dependencies.
                    if node -e 'process.exit(require("./package.json").scripts?.["mutation:scope:full"] ? 0 : 1)'; then
                        npm ci
                    fi
                    node --input-type=module - <<'JS'
                    import fs from 'node:fs';
                    import path from 'node:path';
                    import { execFileSync } from 'node:child_process';
                    const { escape, expandMutate, packFiles } = await import(process.env.MUTATION_REPORTS);
                    // Predicted mutation minutes per shard above which the sweep should take more shards.
                    const TARGET_MINUTES = 120;

                    const fail = (message) => {
                        console.log(`::error::${message}`);
                        process.exit(1);
                    };
                    const output = (name, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
                    const readJson = (file) => {
                        try {
                            return JSON.parse(fs.readFileSync(file, 'utf8'));
                        } catch {
                            return null;
                        }
                    };
                    if (typeof fs.globSync !== 'function' || typeof path.matchesGlob !== 'function') {
                        fail('A sharded full sweep needs Node.js 22.5 or later.');
                    }

                    let patterns;
                    let source;
                    if (readJson('package.json')?.scripts?.['mutation:scope:full']) {
                        source = 'the mutation:scope:full script';
                        patterns = execFileSync('npm', ['run', '-s', 'mutation:scope:full'], { encoding: 'utf8' })
                            .split('\n');
                    } else {
                        source = ['stryker.config.json', '.stryker.conf.json'].find((file) => fs.existsSync(file));
                        if (!source) {
                            fail('A sharded full sweep reads `mutate` from stryker.config.json or .stryker.conf.json,'
                                + ' or takes its scope from a mutation:scope:full script.');
                        }
                        patterns = readJson(source)?.mutate;
                        if (!Array.isArray(patterns) || patterns.length === 0) {
                            fail(`${source} has no \`mutate\` list to split.`);
                        }
                    }
                    const files = expandMutate(patterns);
                    if (files.length === 0) {
                        fail(`The scope from ${source} matches no file.`);
                    }
                    const comma = files.find((file) => file.includes(','));
                    if (comma) {
                        fail(`'${comma}' has a comma, which --mutate cannot carry.`);
                    }

                    const lines = (file) => {
                        try {
                            return fs.readFileSync(file, 'utf8').split('\n').length;
                        } catch {
                            return 1;
                        }
                    };
                    const timed = readJson(process.env.HISTORY)?.files ?? null;
                    const rates = timed ? files.filter((file) => typeof timed[file] === 'number' && lines(file) > 0)
                        .map((file) => timed[file] / lines(file)).sort((a, b) => a - b) : [];
                    const perLine = rates.length ? rates[Math.floor(rates.length / 2)] : null;
                    const weight = (file) => typeof timed?.[file] === 'number'
                        ? timed[file]
                        : lines(file) * (perLine ?? 1);
                    const weights = new Map(files.map((file) => [file, weight(file)]));
                    const bins = packFiles(weights, Number(process.env.SHARDS));
                    const minutes = (bin) => (perLine === null ? null : Math.round(bin.weight / 60));

                    const include = bins.map((bin, index) => ({
                        shard: index + 1,
                        mutate: bin.files.map(escape).join(','),
                        predicted: minutes(bin),
                    }));
                    output('matrix', JSON.stringify({ include }));

                    const rows = bins.map((bin, index) => `| ${index + 1} | ${bin.files.length} | `
                        + `${minutes(bin) ?? 'untimed'} | ${bin.files.map((file) => `\`${file}\``).join(' ')} |`);
                    const summary = ['| Shard | Count | Predicted minutes | Files |', '| --- | --- | --- | --- |',
                        ...rows].join('\n');
                    fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                        `### Full mutation shards\n\n${files.length} file(s) from ${source}.\n\n${summary}\n`);
                    console.log(summary);
                    const busiest = Math.max(...bins.map((bin) => minutes(bin) ?? 0));
                    if (busiest > TARGET_MINUTES) {
                        console.log(`::warning::The busiest of ${bins.length} full mutation shards is predicted to take`
                            + ` ${busiest} minutes of mutation, over the ${TARGET_MINUTES}-minute target. Raise`
                            + ' mutation-full-shards before a shard reaches its time limit.');
                    }
                    JS

    # ==========================================================================
    # JOB: MUTATION FULL SHARD (one runner per planned shard)
    # ==========================================================================
    # Blocking, not advisory: this sweep is the safety net for the per-PR
    # scoping, so anything it finds outside the changed files has to be visible
    # and actionable rather than a silently red-but-passing job. Unsplit, the
    # shard is the whole sweep and Stryker's own threshold decides it. Split,
    # each shard runs every mutant in its files afresh and leaves the threshold
    # to the merged score; it stops before GitHub's six-hour limit so the
    # verdict still runs.
    # ==========================================================================
    mutation-full-shard:
        name: Mutation (full) shard ${{ matrix.shard }}
        needs: mutation-full-plan
        runs-on: ${{ inputs.heavy-runner }}
        timeout-minutes: 345

        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.mutation-full-plan.outputs.matrix) }}

        env:
            MUTATE: ${{ matrix.mutate }}
            SHARD: ${{ matrix.shard }}
            SHARDED: ${{ needs.mutation-full-plan.outputs.sharded }}
            REPORT: reports/stryker-full.json
            RECORD: reports/stryker-full.shard.json

        steps:
            -   name: Note the start
                run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Checkout the report scripts
                if: ${{ env.SHARDED == 'true' }}
                uses: actions/checkout@v7
                with:
                    repository: ${{ job.workflow_repository }}
                    ref: ${{ job.workflow_sha }}
                    path: .mutation-scripts
                    sparse-checkout: .github/scripts
                    persist-credentials: false

            # Out of the workspace, so neither Stryker's sandbox nor the tests see them.
            -   name: Move the report scripts aside
                if: ${{ env.SHARDED == 'true' }}
                run: |
                    mv .mutation-scripts/.github/scripts "$RUNNER_TEMP/mutation-scripts"
                    rm -rf .mutation-scripts
                    echo "MUTATION_REPORTS=$RUNNER_TEMP/mutation-scripts/mutation-reports.mjs" >> "$GITHUB_ENV"

            -   name: Full mutation suite
                if: ${{ env.SHARDED != 'true' }}
                # `incremental` is read on every run, so without `--force` the
                # sweep would reuse the cache and stop being a full rerun. The
                # flag reruns every mutant and rewrites the report, which keeps
                # this working without a second npm script in every consumer.
                run: npm run test:mutation -- --force

            # `--incremental` makes Stryker write the JSON report the merge needs,
            # whatever reporters the caller configures. A shard whose files hold
            # no mutants finds no related tests, and Stryker fails that as a
            # config error.
            -   name: Full mutation shard
                if: ${{ env.SHARDED == 'true' }}
                run: |
                    set -o pipefail
                    rm -f "$REPORT" "$RECORD"
                    mkdir -p reports
                    marker="$RUNNER_TEMP/stryker-started"
                    log="$RUNNER_TEMP/stryker.log"
                    dry_run_done="$RUNNER_TEMP/dry-run-done"
                    touch "$marker"
                    started=$(date +%s)
                    status=0
                    npm run test:mutation -- --incremental --force --incrementalFile "$REPORT" --mutate "$MUTATE" 2>&1 \
                        | awk -v done="$dry_run_done" '!seen && /Initial test run succeeded/ {
                            seen = 1; system("date +%s > " done)
                        } { print; fflush() }' | tee "$log" || status=$?
                    finished=$(date +%s)
                    plain=$(sed "s/$(printf '\033')\[[0-9;]*m//g" "$log")

                    fresh=false
                    if node "$MUTATION_REPORTS" fresh "$REPORT" "$marker"; then
                        fresh=true
                    else
                        rm -f "$REPORT"
                    fi
                    outcome=failed
                    if [ "$status" -eq 0 ] && [ "$fresh" = true ]; then
                        outcome=passed
                    elif grep -Eq 'Instrumented [1-9][0-9]* source file\(s\) with 0 mutant\(s\)' <<< "$plain" \
                        && ! grep -Eq 'Instrumented [0-9]+ source file\(s\) with [1-9][0-9]* mutant\(s\)' <<< "$plain" \
                        && grep -Fq 'No tests were executed. Stryker will exit prematurely' <<< "$plain"; then
                        outcome=empty
                    elif [ "$status" -eq 1 ] && [ "$fresh" = true ] && grep -Eq \
                        'Final mutation score [0-9.]+ under breaking threshold [0-9.]+, setting exit code to 1' \
                        <<< "$plain"; then
                        outcome=deferred
                    fi

                    instrumented=$(grep -Eo 'Instrumented [0-9]+ source file\(s\) with [0-9]+ mutant\(s\)' \
                        <<< "$plain" | tail -n 1 || true)
                    INSTRUMENTED="$instrumented" OUTCOME="$outcome" STATUS="$status" FRESH="$fresh" \
                        STARTED="$started" FINISHED="$finished" DRY_RUN_DONE="$dry_run_done" node - <<'JS'
                    const fs = require('node:fs');
                    const crypto = require('node:crypto');
                    const env = process.env;
                    const counts = /Instrumented (\d+) source file\(s\) with (\d+) mutant\(s\)/.exec(env.INSTRUMENTED);
                    let dryRunDone = null;
                    try {
                        dryRunDone = Number(fs.readFileSync(env.DRY_RUN_DONE, 'utf8').trim());
                    } catch {}
                    const record = {
                        shard: Number(env.SHARD),
                        run: env.GITHUB_RUN_ID,
                        attempt: Number(env.GITHUB_RUN_ATTEMPT),
                        outcome: env.OUTCOME,
                        status: Number(env.STATUS),
                        fresh: env.FRESH === 'true',
                        instrumentedFiles: counts ? Number(counts[1]) : null,
                        instrumentedMutants: counts ? Number(counts[2]) : null,
                        jobStarted: Number(env.JOB_STARTED),
                        started: Number(env.STARTED),
                        dryRunDone,
                        finished: Number(env.FINISHED),
                        digest: env.FRESH === 'true'
                            ? crypto.createHash('sha256').update(fs.readFileSync(env.REPORT)).digest('hex')
                            : null,
                    };
                    fs.writeFileSync(env.RECORD, JSON.stringify(record));
                    console.log(JSON.stringify(record));
                    JS

                    case "$outcome" in
                        passed) exit 0 ;;
                        empty) echo "::notice::Shard $SHARD has no mutants." ;;
                        deferred)
                            echo "::notice::Shard $SHARD is under the break threshold alone; the merged score decides."
                            ;;
                        *) exit "$(( status == 0 ? 1 : status ))" ;;
                    esac

            -   name: Upload shard report
                if: ${{ always() && env.SHARDED == 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-full-shard-${{ matrix.shard }}
                    path: |
                        reports/stryker-full.json
                        reports/stryker-full.shard.json
                    if-no-files-found: ignore
                    overwrite: true
                    retention-days: 7

            -   name: Upload mutation report
                if: ${{ always() && env.SHARDED != 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-report
                    path: build/mutation/
                    retention-days: 30

    # ==========================================================================
    # JOB: MUTATION FULL (verdict)
    # ==========================================================================
    # Unsplit, it passes when the one shard did. Split, it fails on any shard
    # without a fresh, finished report of exactly its own files, then merges
    # the reports, scores them with Stryker's own metrics and applies the break
    # threshold once. A static mutant's timeout scales with its shard's dry
    # run, so static timeouts are counted per shard. The merged report is
    # published, and the timings saved for the next plan.
    # ==========================================================================
    mutation-full:
        name: Mutation (full)
        needs: [ mutation-full-plan, mutation-full-shard ]
        if: >-
            ${{ always() && inputs.run-mutation
            && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest

        env:
            SHARDED: ${{ needs.mutation-full-plan.outputs.sharded }}

        steps:
            -   name: Check the shard
                if: ${{ env.SHARDED != 'true' }}
                env:
                    PLAN: ${{ needs.mutation-full-plan.result }}
                    SHARDS: ${{ needs.mutation-full-shard.result }}
                run: |
                    [ "$PLAN" = success ] || { echo "::error::Mutation (full) plan: $PLAN"; exit 1; }
                    [ "$SHARDS" = success ] || { echo "::error::Mutation (full) shard: $SHARDS"; exit 1; }

            -   name: Checkout
                if: ${{ env.SHARDED == 'true' }}
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Checkout the report scripts
                if: ${{ env.SHARDED == 'true' }}
                uses: actions/checkout@v7
                with:
                    repository: ${{ job.workflow_repository }}
                    ref: ${{ job.workflow_sha }}
                    path: .mutation-scripts
                    sparse-checkout: .github/scripts
                    persist-credentials: false

            -   name: Setup Node.js
                if: ${{ env.SHARDED == 'true' }}
                uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node-version }}
                    cache: npm

            # Stryker's own install supplies the scoring and report packages.
            -   name: Install dependencies
                if: ${{ env.SHARDED == 'true' }}
                run: npm ci --ignore-scripts

            -   name: Download shard reports
                if: ${{ env.SHARDED == 'true' }}
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    pattern: mutation-full-shard-*
                    path: ${{ runner.temp }}/shards

            -   name: Merge and score the shards
                id: verdict
                if: ${{ env.SHARDED == 'true' }}
                env:
                    MATRIX: ${{ needs.mutation-full-plan.outputs.matrix }}
                    SHARDS: ${{ needs.mutation-full-shard.result }}
                    SHARDS_DIR: ${{ runner.temp }}/shards
                    HISTORY: ${{ runner.temp }}/mutation-full-history.json
                run: |
                    node --input-type=module - <<'JS'
                    import fs from 'node:fs';
                    import crypto from 'node:crypto';
                    const lib = await import(`${process.cwd()}/.mutation-scripts/.github/scripts/mutation-reports.mjs`);
                    const LIMIT_MINUTES = 345;

                    const summary = (text) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`);
                    const output = (name, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
                    const minutes = (from, to) => (from && to ? ((to - from) / 60).toFixed(0) : '-');
                    const plan = JSON.parse(process.env.MATRIX).include;
                    const scopes = new Map(plan.map(({ shard, mutate }) => [shard, lib.parseScope(mutate)]));
                    const problems = [];
                    if (process.env.SHARDS !== 'success') {
                        problems.push(`The shards ended ${process.env.SHARDS}.`);
                    }

                    const { found, missing } = lib.collectShards(process.env.SHARDS_DIR, 'mutation-full-shard-',
                        plan.map(({ shard }) => shard), 'stryker-full.shard.json');
                    missing.forEach((shard) => problems.push(`Shard ${shard} uploaded nothing.`));

                    const entries = [];
                    const rows = [];
                    for (const { shard, locate, read } of found.sort((a, b) => a.shard - b.shard)) {
                        if (shard === null) {
                            problems.push('A shard artifact names no shard.');
                            continue;
                        }
                        const scope = scopes.get(shard);
                        const record = read('stryker-full.shard.json');
                        if (!record || record.shard !== shard || String(record.run) !== process.env.GITHUB_RUN_ID) {
                            problems.push(`Shard ${shard} has no record from this run.`);
                            continue;
                        }
                        if (record.instrumentedFiles !== scope.size) {
                            problems.push(`Shard ${shard} instrumented ${record.instrumentedFiles ?? 'no'} of its`
                                + ` ${scope.size} file(s); Stryker ignored or could not read the rest.`);
                        }
                        const elapsed = (record.finished - record.jobStarted) / 60;
                        if (elapsed > LIMIT_MINUTES / 2) {
                            console.log(`::warning::Full mutation shard ${shard} took ${elapsed.toFixed(0)} minutes,`
                                + ` over half its ${LIMIT_MINUTES}-minute limit. Raise mutation-full-shards.`);
                        }
                        const row = { shard, record, files: scope.size, mutants: 0, statics: 0, staticTimeouts: 0 };
                        rows.push(row);
                        if (record.outcome === 'empty') {
                            if (record.instrumentedMutants !== 0) {
                                problems.push(`Shard ${shard} reported no mutants after instrumenting some.`);
                            }
                            continue;
                        }
                        if (!['passed', 'deferred'].includes(record.outcome) || !record.fresh) {
                            problems.push(`Shard ${shard} ${record.outcome} with exit code ${record.status}.`);
                            continue;
                        }
                        const file = locate('stryker-full.json');
                        const report = file && read('stryker-full.json');
                        if (!report) {
                            problems.push(`Shard ${shard} has no report.`);
                            continue;
                        }
                        const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
                        if (digest !== record.digest) {
                            problems.push(`Shard ${shard}'s report is not the one it recorded.`);
                            continue;
                        }
                        problems.push(...lib.reportProblems(report, scope).map((text) => `Shard ${shard} ${text}.`));
                        for (const result of Object.values(report.files)) {
                            for (const mutant of result.mutants ?? []) {
                                row.mutants++;
                                row.statics += mutant.static ? 1 : 0;
                                row.staticTimeouts += mutant.static && mutant.status === 'Timeout' ? 1 : 0;
                            }
                        }
                        if (row.mutants !== record.instrumentedMutants) {
                            problems.push(`Shard ${shard} reported ${row.mutants} of its`
                                + ` ${record.instrumentedMutants} mutant(s).`);
                        }
                        entries.push({ shard, report });
                    }

                    const cells = (values) => `| ${values.join(' | ')} |`;
                    const table = [
                        cells(['Shard', 'Files', 'Mutants', 'Static', 'Static timeouts', 'Dry run (min)',
                            'Mutation (min)', 'Job (min)', 'Outcome']),
                        cells(Array(9).fill('---')),
                        ...rows.map(({ shard, record, files, mutants, statics, staticTimeouts }) => cells([shard, files,
                            mutants, statics, staticTimeouts, minutes(record.started, record.dryRunDone),
                            minutes(record.dryRunDone, record.finished), minutes(record.jobStarted, record.finished),
                            record.outcome])),
                    ].join('\n');
                    summary(`### Full mutation shards\n\n${table}\n`);
                    console.log(table);

                    if (problems.length > 0) {
                        problems.forEach((problem) => console.log(`::error::${problem}`));
                        summary(`\n${problems.map((problem) => `- ${problem}`).join('\n')}\n`);
                        process.exit(1);
                    }
                    if (entries.length === 0) {
                        console.log('::error::No shard reported a mutant.');
                        process.exit(1);
                    }

                    const { report, mutants } = lib.mergeReports(entries, scopes);
                    const expected = rows.reduce((sum, row) => sum + row.mutants, 0);
                    if (mutants !== expected) {
                        console.log(`::error::The merge kept ${mutants} of ${expected} mutant(s).`);
                        process.exit(1);
                    }
                    fs.mkdirSync('build/mutation', { recursive: true });
                    fs.writeFileSync('build/mutation/mutation.json', JSON.stringify(report));
                    fs.writeFileSync('build/mutation/mutation.html', lib.renderHtml(report));
                    output('merged', 'true');

                    const timings = lib.measureFiles(report, rows.map(({ shard, record }) => ({
                        scope: scopes.get(shard),
                        seconds: record.outcome === 'empty'
                            ? 0
                            : record.finished - (record.dryRunDone ?? record.started),
                    })));
                    for (const { shard, record } of rows) {
                        if (record.outcome === 'empty') {
                            scopes.get(shard).forEach((_, file) => {
                                timings[file] = 0;
                            });
                        }
                    }
                    fs.writeFileSync(process.env.HISTORY, JSON.stringify({ version: 1, files: timings }));
                    output('history', 'true');

                    const { score, detected, timedOut, undetected, counted } = await lib.scoreReport(report);
                    const threshold = report.thresholds?.break;
                    const verdict = counted === 0
                        ? 'Mutation score: no counted mutants.'
                        : `Mutation score: ${score.toFixed(2)} (${detected} detected, ${timedOut} of them by timeout,`
                            + ` ${undetected} undetected) across ${entries.length} shard(s), ${mutants} mutant(s).`;
                    const lines = lib.undetectedLines(report);
                    lines.forEach((line) => console.log(line));
                    console.log(verdict);
                    const listed = lines.slice(0, 500);
                    summary(`\n${verdict}\n` + (listed.length ? `\n~~~text\n${listed.join('\n')}\n~~~\n` : '')
                        + (lines.length > listed.length
                            ? `\n${lines.length - listed.length} more in the report.\n`
                            : ''));
                    if (lib.breaks(score, threshold)) {
                        console.log(`::error::Score ${score.toFixed(2)} is under break threshold ${threshold}.`);
                        process.exit(1);
                    }
                    JS

            -   name: Upload mutation report
                if: ${{ always() && steps.verdict.outputs.merged == 'true' }}
                uses: actions/upload-artifact@v7
                with:
                    name: mutation-report
                    path: build/mutation/
                    retention-days: 30

            -   name: Save the sweep timings
                if: ${{ always() && steps.verdict.outputs.history == 'true' }}
                continue-on-error: true
                uses: actions/cache/save@v6
                with:
                    path: ${{ runner.temp }}/mutation-full-history.json
                    key: stryker-full-history-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
